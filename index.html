<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC-TAC-TOE GAME</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script defer src="script.js"></script>
</head>

<body>
    <div class="container">
        <section class="main">
            <h1>
                WELCOME TO TIC-TAC-TOE GAME
            </h1>
            <form action="" class="playerinfo" id="playerinfo">
                <label for="">X</label>
                <input type="text" placeholder="Enter player name" id="player1">
                <label for="">O</label>
                <input type="text" placeholder="Enter player name" id="player2">
                <button type="submit" class="start">Start Game</button>
                <div class="online-controls">
                    <input id="roomIdInput" placeholder="Room ID (optional)" />
                    <button type="button" id="playOnlineBtn">Play Online</button>
                </div>
            </form>
        </section>
        <section id="gameBoard">
            <div class="scoreboard">
                <div class="temp">
                    <div class="player-score" id="playerX">
                        <span class="label" id="nameX">Player X</span>
                        <span class="score" id="scoreX">0</span>
                    </div>
                    <div class="player-score" id="playerO">
                        <span class="label" id="nameO">Player O</span>
                        <span class="score" id="scoreO">0</span>
                    </div>
                </div>

                <div class="timer" id="timerBox">
                    <span class="turn-label" id="turnLabel">Turn: X</span>
                    <span class="time-left">Time left: <span id="moveTimer">10s</span></span>
                </div>
                <div style="margin-left:8px">
                    <button type="button" class="reset-scores" id="resetScores">Reset Scores</button>
                </div>
            </div>
            <form action="">
                <div class="board">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>
                    <div class="cell" data-index="2"></div>
                    <div class="cell" data-index="3"></div>
                    <div class="cell" data-index="4"></div>
                    <div class="cell" data-index="5"></div>
                    <div class="cell" data-index="6"></div>
                    <div class="cell" data-index="7"></div>
                    <div class="cell" data-index="8"></div>

                </div>
            </form>
        </section>

    </div>

</body>

</html>
